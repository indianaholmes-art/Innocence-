[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nethunter-rf"
version = "1.0.0"
description = "Kali NetHunter host app for the ESP32-S3 + CC1101 RF Bridge"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5", "rich>=13.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nethunter-rf = "nethunter_rf.cli:main"

[tool.setuptools]
packages = ["nethunter_rf"]
