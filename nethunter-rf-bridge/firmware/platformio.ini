; NetHunter RF Bridge firmware
; Build:   pio run -e esp32s3_devkitc
; Flash:   pio run -e esp32s3_devkitc -t upload
; Sim:     pio run -e esp32s3_sim     (no CC1101 required)

[platformio]
default_envs = esp32s3_devkitc

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.2.1
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1          ; HW CDC/JTAG controller on native USB-C
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial == native USB CDC
build_unflags = -std=gnu++11

; Espressif ESP32-S3-DevKitC-1 (N8 / N8R2 / N8R8 / N16R8)
[env:esp32s3_devkitc]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DRFB_BOARD_DEVKITC1

; Generic / clone boards (e.g. "ESP32-S3 N16R8" boards, YD-ESP32-S3)
[env:esp32s3_generic]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DRFB_BOARD_GENERIC_S3

; Simulation build: no radio hardware needed, synthetic packets/RSSI
[env:esp32s3_sim]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DRFB_BOARD_DEVKITC1 -DRFB_SIMULATION=1

; Future target placeholder: ESP32-C3 (USB Serial/JTAG)
[env:esp32c3_devkitm]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DRFB_BOARD_C3_DEVKITM
